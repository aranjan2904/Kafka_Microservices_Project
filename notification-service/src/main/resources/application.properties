spring.application.name=notification-service

server.port=8084


# Kafka


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=notification-service-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer


spring.kafka.consumer.properties.spring.json.trusted.packages=*


spring.kafka.consumer.properties.spring.json.type.mapping=\
orderCreated:com.ecommerce.notificationservice.kafka.OrderCreatedEvent,\
paymentSuccess:com.ecommerce.notificationservice.kafka.PaymentSuccessEvent,\
paymentFailed:com.ecommerce.notificationservice.kafka.PaymentFailedEvent,\
deliveryCreated:com.ecommerce.notificationservice.kafka.DeliveryCreatedEvent