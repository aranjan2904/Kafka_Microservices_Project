spring.application.name=delivery-service


# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/delivery_service_db
spring.datasource.username=root
spring.datasource.password=Shubham@2904

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Server
server.port=8083



# Kafka

spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.properties.spring.json.type.mapping=deliveryCreated:com.ecommerce.deliveryservice.kafka.DeliveryCreatedEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Consumer

# Kafka Consumer

spring.kafka.consumer.group-id=delivery-service-group

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.type.mapping=paymentSuccess:com.ecommerce.deliveryservice.kafka.PaymentSuccessEvent